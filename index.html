<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HUNDRED</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2633">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-MS08BQXMRY"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-MS08BQXMRY');
</script>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">


    <div id="homeScreen">
    
      <h2 class="menuTitle">Select Level</h2>

    </div>

    <div id="gameScreen">
        <div class="gameHeader">
            <button id="homeButton">
              ← Levels
            </button>

            <div class="levelTitle">
              Level 1
           </div>

            <button id="muteButton" title="Toggle sound">🔊</button>
        </div>

        <div class="objective">
           🎯 <strong>Objective:</strong> Solve all <strong>5 Hidden Numbers</strong> before you run out of coins.
        </div>


        <div class="statusPanel">
            <div class="coinsAndBest">
                <div class="coinPanel">
                  💰 <span id="coins">40</span>
                </div>

                <div class="bestScorePanel" id="bestScorePanel" style="display:none;">
                  <span class="trophyIcon">🏆</span>
                  <span class="bestScoreText">
                    <span class="bestScoreLabel">Best Score</span>
                    <span class="bestScoreValue" id="bestScoreDisplay">--</span>
                  </span>
                </div>
            </div>

            <div class="progressContainer">
                <div id="progressBar" class="progressBar"></div>
            </div>

            <div id="progressText">
              0 / 5
            </div>

         </div>

      <!-- Guess Area moved here -->

      <div class="guessArea">

          <input
              type="number"
              id="guessInput"
              min="1"
              max="100"
              placeholder="Guess the hidden number (1–100)">

          <button id="guessButton">
              Guess
          </button>

          <button id="nextButton" style="display:none;">
              Next Question →
          </button>

      </div>

      <div id="message"></div>

      <div class="mainLayout">

          <div class="section" id="buyCluesSection">

              <h2>Buy Clues</h2>

              <div id="clueContainer"></div>

          </div>

      </div>
  </div>

</div>

<script src="clues.js"></script>
<script src="levels.js"></script>
<script src="percentileData.js"></script>
<script src="sounds.js"></script>
<script src="script.js"></script>

</body>
</html>
