<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HUNDRED</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>HUNDRED</h1>

    <div class="topBar">

        <div class="stat">
            💰 Coins
            <span id="coins">100</span>
        </div>

        <div class="stat">
            ✅ Solved
            <span id="solved">0</span>
        </div>

        <div class="stat">
            ❌ Missed
            <span id="missed">0</span>
        </div>

        <div class="stat">
            🎴 Remaining
            <span id="remaining">100</span>
        </div>

    </div>

    <div class="mainLayout">

      <div class="section">

        <h2>Buy Clues</h2>

        <div id="clueContainer"></div>

      </div>

      <div class="section">

        <h2>Revealed Clues</h2>

        <div id="revealedClues">
            No clues purchased.
        </div>

      </div>

    </div>

    <div class="guessArea">

        <input
            type="number"
            id="guessInput"
            min="1"
            max="100"
            placeholder="Guess 1-100">

        <button id="guessButton">

            Guess

        </button>
        <button id="nextButton" style="display:none;">
            Next Round
        </button>

    </div>


    <div id="message"></div>

</div>

<script src="script.js"></script>

</body>
</html>
