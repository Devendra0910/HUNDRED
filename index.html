<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>HUNDRED</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="container">


    <div id="homeScreen">
    
      <h2 class="menuTitle">Select Level</h2>

    </div>

    <div id="gameScreen">

      <h1> HUNDRED </h1>
      <div class="objective">
          🎯 <strong>Objective:</strong> Solve all <strong>5 Hidden Numbers</strong> before you run out of coins.
      </div>

      <div class="topBar">

          <div class="stat">
              💰 Coins
              <span id="coins">40</span>
          </div>
      </div>

      <div class="progressContainer">
          <div id="progressBar" class="progressBar"></div>
      </div>

      <div id="progressText" class="progressText">
          0 / 5 Complete
      </div>

      <!-- Guess Area moved here -->

      <div class="guessArea">

          <input
              type="number"
              id="guessInput"
              min="1"
              max="100"
              placeholder="Guess the hidden number (1–100)">

          <button id="guessButton">
              Guess
          </button>

          <button id="nextButton" style="display:none;">
              Next Question →
          </button>

      </div>

      <div id="message"></div>

      <div class="mainLayout">

          <div class="section" id="buyCluesSection">

              <h2>Buy Clues</h2>

              <div id="clueContainer"></div>

          </div>

      </div>
  </div>

</div>

<script src="clues.js"></script>
<script src="levels.js"></script>
<script src="script.js"></script>

</body>
</html>
